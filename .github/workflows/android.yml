name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The ubuntu-latest runner ships the Android SDK at
      # /usr/local/lib/android/sdk (ANDROID_HOME set, licenses pre-accepted).
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Materialise the signing key + credentials from repository secrets.
      - name: Materialise signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore materialised ($(wc -c < app/release.keystore) bytes)."

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

      - name: Verify APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          ls -lh "$APK"
          $ANDROID_HOME/build-tools/*/apksigner verify --print-certs "$APK" | head -5 || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tahlil-singkat-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Tahlil Singkat v2.0.0 (Native Kotlin)
          body: |
            ## Tahlil Singkat v2.0.0 — Native Android (Kotlin + Jetpack Compose)

            Port ulang penuh dari aplikasi web Next.js (zip sumber) ke **native Android Kotlin**.
            Bukan lagi app WebView/Capacitor — sekarang murni Jetpack Compose.

            ### Fitur
            - 10+ bagian tahlil ringkas: teks Arab (3 mode font: Mushaf Quran / Amiri / Naskhi), transliterasi Latin, terjemahan Indonesia.
            - Panel Tampilan: toggle Arab / transliterasi / terjemahan on/off.
            - **Layar Tetap Hidup** — cegah layar terkunci saat membaca (toggle on/off di Pengaturan Tampilan; memakai `FLAG_KEEP_SCREEN_ON` window flag — pola native Android wakelock dari android/skills).
            - Mode gelap/terang (system/light/dark), daftar isi (drawer), tombol kembali ke atas, progress bar bacaan.
            - Semua preferensi tersimpan otomatis (SharedPreferences) dan dipulihkan saat app dibuka lagi.
            - Font Arab asli dibundel: Amiri, Amiri Quran, Scheherazade New.
            - Warna tema dikonversi persis dari token OKLCH sumber (cream/emerald/gold).

            ### Teknis
            - Bahasa: Kotlin 2.0.21, Jetpack Compose (Material3), AGP 8.7.3, Gradle 8.9.
            - minSdk 26, targetSdk 34.
            - Berisi APK signed (release) — pasang langsung.
          files: app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
