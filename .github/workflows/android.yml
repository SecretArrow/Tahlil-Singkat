name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 2.3.0

jobs:
  # Fast feedback: static analysis + JVM unit tests (no emulator needed).
  quality:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint
        run: ./gradlew :app:lint --no-daemon --max-workers=2

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Upload lint + unit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          retention-days: 7
          if-no-files-found: warn

  # E2E: Compose UI tests on a headless emulator — verifies the real app.
  e2e:
    name: E2E (emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # KVM hugely speeds up the emulator; fail fast if it's missing.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (connectedAndroidTest)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2
            # Fail the job if zero tests were discovered (broken runner config).
            RESULTS=$(find app/build/outputs/androidTest-results -name "*.xml" -exec grep -h "tests=" {} \;)
            echo "Instrumented test summary: $RESULTS"
            TOTAL=$(echo "$RESULTS" | sed -n 's/.*tests="\([0-9]*\)".*/\1/p' | awk '{s+=$1} END {print s+0}')
            echo "Total instrumented tests: $TOTAL"
            if [ -z "$TOTAL" ] || [ "$TOTAL" -eq 0 ]; then
              echo "::error::connectedAndroidTest ran 0 tests — test runner is misconfigured"
              exit 1
            fi

      - name: Upload e2e results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: app/build/outputs/androidTest-results/
          retention-days: 7
          if-no-files-found: warn

  # Release: signed split-per-ABI APKs + GitHub Release. Only after quality+e2e pass.
  release:
    name: Build & publish signed split APKs
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Materialise the signing key + credentials from repository secrets.
      - name: Materialise signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          echo "Keystore materialised ($(wc -c < app/release.keystore) bytes)."

      # Builds one signed APK per ABI (arm64-v8a, armeabi-v7a, x86_64) + a
      # universal fallback — see android.splits.abi in app/build.gradle.kts.
      - name: Build signed split-per-ABI release APKs
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

      - name: Rename + verify APKs
        run: |
          set -e
          mkdir -p release-out
          # Pick exactly one build-tools dir (the runner ships several).
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null | sort -V | tail -1)apksigner"
          echo "apksigner: $APKSIGNER"
          cd app/build/outputs/apk/release
          for f in *.apk; do
            case "$f" in
              app-arm64-v8a-release.apk)       abi=arm64-v8a ;;
              app-armeabi-v7a-release.apk)     abi=armeabi-v7a ;;
              app-x86_64-release.apk)          abi=x86_64 ;;
              app-universal-release.apk|app-release.apk) abi=universal ;;
              *)                               abi=unknown ;;
            esac
            out="$GITHUB_WORKSPACE/release-out/TahlilSingkat-v${APP_VERSION}-${abi}.apk"
            cp "$f" "$out"
            "$APKSIGNER" verify --print-certs "$out" >/dev/null \
              && echo "OK signed: ${abi} ($(wc -c < "$out") bytes)" \
              || { echo "FAIL signature invalid: ${abi}"; exit 1; }
          done
          ls -lh "$GITHUB_WORKSPACE/release-out/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tahlil-singkat-apk
          path: release-out/*.apk
          if-no-files-found: error

      # Re-publish on every push: clear any prior release/tag first.
      - name: Clear existing release
        run: gh release delete "v${APP_VERSION}" --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Tahlil Singkat v${{ env.APP_VERSION }} (Native Kotlin)
          body: |
            ## Tahlil Singkat v${{ env.APP_VERSION }} — Native Android (Kotlin + Jetpack Compose)

            ### Baru di v${{ env.APP_VERSION }}
            - **Perbaikan harakat Naskhi Tebal** (audit 38 blok): +10 sukun pada `وَالْ…` (wa+al+syamsiyyah), +6 fathah+syadda pada `لِلَّهِ` (li-llah), varian "Allah" tetap konvensi idgham.
            - **Toggle "Warnai Kata Arab"** — setiap kata Arab diberi warna bergantian (terang: hitam & navy; gelap: putih & abu-abu terang) agar kata berurutan mudah dibedakan.
            - **Varian koma dihitung ulang untuk 19 blok** — toggle "Koma Mengikuti Terjemahan" kini bekerja untuk semua doa relevan.
            - **CI lengkap**: lint + unit test + e2e (emulator) sebelum build & release.

            ### Sejak v2.2.0
            - Tombol "Mulai", lanjut bacaan terakhir, konfirmasi keluar, koma teks Arab.

            ### Fitur
            - 11 bagian tahlil: teks Arab (3 mode font: Mushaf Quran / Amiri / Naskhi), transliterasi Latin, terjemahan Indonesia.
            - Panel Tampilan: toggle Arab / transliterasi / terjemahan + Layar Tetap Hidup + Koma & Warnai.
            - Panel Teks Arab: 3 mode + slider ukuran/jarak + perataan + pratinjau langsung.
            - Mode gelap/terang, daftar isi (drawer), layar penuh (immersive), tombol kembali ke atas, progress bar bacaan.
            - Preferensi tersimpan otomatis (SharedPreferences).

            ### Teknis
            - Kotlin 2.0.21, Jetpack Compose (Material3), AGP 8.7.3, Gradle 8.9, minSdk 26, targetSdk 34.
            - Semua APK signed dengan keystore rilis (CN=Tahlil Singkat, O=SecretArrow, Jakarta).
          files: |
            release-out/TahlilSingkat-v${{ env.APP_VERSION }}-arm64-v8a.apk
            release-out/TahlilSingkat-v${{ env.APP_VERSION }}-armeabi-v7a.apk
            release-out/TahlilSingkat-v${{ env.APP_VERSION }}-x86_64.apk
            release-out/TahlilSingkat-v${{ env.APP_VERSION }}-universal.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
