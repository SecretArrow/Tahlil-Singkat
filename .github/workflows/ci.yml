name: CI

# Runs on every push to main and on PRs. The `test` job verifies code quality
# (lint, typecheck, unit tests, static export build, Playwright e2e). The
# `release` job runs ONLY on main, AFTER `test` passes, and auto-publishes a
# signed split-per-ABI APK release — no manual tagging required.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Auto-releases need contents:write. Pull-requests:write lets the bot push
# auto-fix commits back to the PR / main.
permissions:
  contents: write
  pull-requests: write

# Cancel a superseded in-flight run for the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  test:
    name: Lint · Typecheck · Unit · Build · E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Auto-fix: run the ESLint fixer first so fixable style/format issues
      # heal themselves before the gate check. Any change is committed back
      # (main only) with [skip ci] so it never loops.
      - name: Auto-fix lint issues
        run: npm run lint:fix

      - name: Commit auto-fixes (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "ci: auto-fix lint/format [skip ci]"
            git push
          else
            echo "No auto-fixable changes."
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build static export
        run: npm run build

      # Cache the Playwright browser binary between runs — saves ~30s & 120MB
      # of download on every subsequent CI run.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      # Surface the HTML report + traces when something flakes or breaks.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  release:
    name: Build & publish signed split APKs
    needs: test
    # Only auto-release on main pushes (PRs skip this). Secrets are not
    # available to fork PRs, so this guards against unsigned attempts too.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Per-run versioning — versionCode must be an int that strictly increases
      # across releases; run_number monotonically increments per workflow run.
      APP_VERSION_CODE: ${{ github.run_number }}
      APP_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Note: ubuntu-latest ships the Android SDK (platform-tools, platforms;
      # android-34, build-tools) at $ANDROID_HOME — no setup-android step
      # needed, and the action's interactive license prompt hangs in CI.

      - name: Install dependencies
        run: npm ci

      - name: Build web (static export)
        run: npm run build

      - name: Sync web assets into Android project
        run: npx cap sync android

      # Materialise the signing key + credentials from repository secrets.
      # The keystore lives outside the app module at android/release.keystore;
      # keystore.properties points at it (see android/keystore.properties.example).
      - name: Materialise signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=../release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Keystore materialised ($(wc -c < android/release.keystore) bytes)."

      - name: Build signed split-per-ABI APKs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Rename each split APK to a human-friendly name that includes the
      # version + ABI, so the GitHub Release asset list reads clearly.
      - name: Collect & rename APKs
        id: apks
        run: |
          set -e
          mkdir -p release-out
          V="v${APP_VERSION_NAME}"
          APK_DIR="android/app/build/outputs/apk/release"
          declare -A MAP=(
            ["arm64-v8a"]="arm64-v8a"
            ["armeabi-v7a"]="armeabi-v7a"
            ["x86_64"]="x86_64"
            ["universal"]="universal"
          )
          ASSETS=""
          for abi in "${!MAP[@]}"; do
            src="$APK_DIR/app-${abi}-release.apk"
            if [ -f "$src" ]; then
              dst="release-out/TahlilSingkat-${V}-${abi}.apk"
              cp "$src" "$dst"
              ASSETS="$ASSETS$dst\n"
              echo "Built $dst ($(wc -c < "$dst") bytes)"
            else
              echo "::warning::Missing $src"
            fi
          done
          printf "%b" "$ASSETS" > release-out/assets.txt
          echo "assets<<EOF" >> "$GITHUB_OUTPUT"
          cat release-out/assets.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Verify APK signatures
        run: |
          # Locate apksigner in whichever build-tools version the runner ships.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found under $ANDROID_HOME/build-tools"
            exit 1
          fi
          for apk in release-out/*.apk; do
            echo "=== $apk ==="
            "$APKSIGNER" verify --print-certs "$apk" | head -8
          done

      # Auto-release: create a GitHub Release for this main push, tagged with
      # the version, and attach every signed split APK. Uses the built-in
      # GITHUB_TOKEN — no PAT is ever needed in CI.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION_NAME }}
          name: Tahlil Singkat v${{ env.APP_VERSION_NAME }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-out/TahlilSingkat-v${{ env.APP_VERSION_NAME }}-arm64-v8a.apk
            release-out/TahlilSingkat-v${{ env.APP_VERSION_NAME }}-armeabi-v7a.apk
            release-out/TahlilSingkat-v${{ env.APP_VERSION_NAME }}-x86_64.apk
            release-out/TahlilSingkat-v${{ env.APP_VERSION_NAME }}-universal.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks-v${{ env.APP_VERSION_NAME }}
          path: release-out/*.apk
          retention-days: 14
